  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%;

  .internals .battery{ width:76px; height:76px; left:calc(50% - 38px); bottom:7%; border-radius:50%;

  .internals .sa{ left:16%; top:21%; } .internals .sb{ right:14%; top:17%; } .internals .sc{ left:20%; bottom:25%; } .internals .sd{ right:20%; bottom:31%; }

  /* the coloured plastic case */
  .plastic{ z-index:1; background:var(--plastic); border:1px solid var(--shell-edge);

      0 0 0 1px rgba(255,255,255,.12) inset; }
  .plastic::before{ content:''; position:absolute; left:12%; right:34%; top:4%; height:24%;

  .caption{ text-align:center; min-height:30px; padding:12px 6px 4px;

  .caption b{ color:var(--brand-col); }
  .pad{ display:flex; justify-content:center; gap:26px; padding-top:6px; }
  .btn{ position:relative; width:60px; height:60px; border-radius:50%; border:none; cursor:pointer; color:#fff; touch-action:manipulation;
    background:radial-gradient(120% 120% at 35% 28%, var(--coral-hi), var(--coral) 55%, var(--coral-lo));
    box-shadow:0 3px 0 var(--coral-lo), 0 8px 14px -6px rgba(0,0,0,.35), 0 1px 1px rgba(255,255,255,.5) inset;
    transition:transform .04s ease, box-shadow .04s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  .btn .k{ font:800 15px ui-sans-serif,system-ui,sans-serif; line-height:1; }
  .btn .fn{ font:700 8px ui-monospace,monospace; letter-spacing:.5px; opacity:.85; }
  .btn:active,.btn.press{ transform:translateY(3px);
    box-shadow:0 0 0 var(--coral-lo), 0 3px 8px -4px rgba(0,0,0,.35), 0 1px 1px rgba(255,255,255,.4) inset; }
  .btn:focus-visible{ outline:3px solid var(--brand-col); outline-offset:3px; }
  .hint{ text-align:center; font:500 10px ui-sans-serif,system-ui,sans-serif; color:var(--cap); padding-top:14px; opacity:.85; }
  .hint kbd{ font:600 10px ui-monospace,monospace; background:rgba(255,255,255,.35); border:1px solid var(--shell-edge); border-radius:5px; padding:1px 5px; }
  @media (prefers-reduced-motion:reduce){ .btn,.internals,.device{ transition:none; } }
</style>

<script>
(() => {
"use strict";

const cv = document.getElementById('lcd');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 64, H = 64;

/* ---- ART STYLES: the 6 looks from the Art Lab; testers can switch live (🎨) ---- */
const STYLES = [

  { name:'BACKLIT COLOR', field:'#0f1319', pal:[null,'#6fe0c0','#3aa88a','#1d5f56'],

  { name:'OLED 1-BIT', field:'#0a0d0a', pal:[null,'#7dff9a','#7dff9a','#7dff9a'],
    eyeLight:'#0a0d0a', pupil:'#7dff9a', mid:'#39b45f', ink:'#7dff9a', dim:'#123a1c', night:'rgba(0,0,0,.5)' },
];
function mkLCD(st){ return { bg:st.field, dim:st.dim, mid:st.mid, ink:st.ink }; }
let styleIdx = 2, STYLE = STYLES[2], LCD = mkLCD(STYLE);
function applyStyle(i){ styleIdx=((i%STYLES.length)+STYLES.length)%STYLES.length; STYLE=STYLES[styleIdx]; LCD=mkLCD(STYLE);
  const scr=document.querySelector('.screen'); if(scr) scr.style.background=STYLE.field;
  try{ localStorage.setItem('hatch_style',String(styleIdx)); }catch(e){}
}

/* ---------- TUNABLE TIMING (seconds; scaled by care mode) ---------- */
// COMMERCIAL PACE (AUTHENTIC mode) — modelled on real Tamagotchi rates:
// ~1 hunger/happy heart per hour, poop ~every 2 h, 15-min window to answer a
// call before it's a care mistake. GENTLE mode multiplies these (see PACE_MULT).
// Press F to fast-forward time 60x for dev/testing.
const T = {
  hatch: 12,
  babyToChild: 3600,       // ~1 h  (Tama baby stage is short)
  childToTeen: 86400,      // ~1 day
  teenToAdult: 172800,     // ~2 days  (adult reached day 2-3)
  adultToElder: 345600,    // ~4 days as adult — rare "elder" for a well-raised pet
  hungerInterval: 3600,    // 1 heart / hour
  happyInterval: 3600,     // 1 heart / hour
  poopInterval: 7200,      // ~2 h
  energyDrain: 500, energyGain: 300,
  sicknessGrace: 5400, healthDrainSick: 2700, healthRegen: 1800,
  careStrikeAfter: 900,    // 15 min to answer a call (commercial)
  offlineCap: 259200,      // absorb up to 72 h away
  sickImmuneUntil: 600,    // no illness in a pet's first ~10 min of life
};
const PACE_MULT = 1.8;     // GENTLE mode = 1.8x slower needs (and never dies)
const STAGES = ['egg','baby','child','teen','adult','elder'];
const SAVE_KEY = 'hatch01_save_v6';
const DONATE_URL = 'https://paypal.me/SamuelFirn';   // enables the SUPPORT screen's donate button
const FEEDBACK_URL = 'https://hatchpet.pages.dev/feedback';   // on-brand feedback form (emails Sam via FormSubmit)

let s = null;
function freshEgg(){
  return {
    v:6, bornAt:Date.now(), last:Date.now(), name:'', petName:'',
    careMode:'classic', chosen:false,
    stage:0, stageAt:0, species:null, form:null, careAtStage:0, ageSec:0,
    hunger:1, happy:1, energy:100, health:100, weight:20, discipline:20,   // born a little hungry — nudges the player to feed early
    asleep:false, lightOn:true, poop:0, sick:false, alive:true,
    care:0, training:0, overfeed:0, fullSum:0, fullN:0, maxed:false,
    hi:{guess:0,memory:0,timing:0}, points:0,
    tHatch:0, tHunger:0, tHappy:0, tPoop: rand(T.poopInterval*0.6, T.poopInterval*1.4),
    tEnergy:0, tHealth:0, tSick:0,
    strikeHunger:0, strikeHappy:0, strikePoop:0, strikeSleep:0, strikeSick:0,
  };
}
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function stageSec(){ return s.ageSec - (s.stageAt||0); }

const BABY_FORMS  = ['momo','pabu','tama','nubb','drakelet','hornlet','jawlet','pricklet','cubling','maneling','unilet','tusklet','fledgling','batling','owlet','grublet'];
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ============================================================
   SPRITES — 1-bit silhouettes; shading auto-derived at load.
   Eyes drawn as light sclera + pupil for that modern-cute look.
   ============================================================ */
const SPRITES = {
egg:{sil:["     ####     ","    ######    ","   ########   ","  ##########  ","  ##########  "," ############ "," ############ "," ############ "," ############ "," ############ ","  ##########  ","  ##########  ","   ########   ","    ######    "],eyes:[]},
momo:{sil:["","","","","   #########","  ###########","  ###########","  ###########","  ###########","  ###########","   #########","     ## ##","","",""],eyes:[{x:4,y:6,w:3,h:4},{x:8,y:6,w:3,h:4}],mouth:{x:6,y:9,w:2,h:1}},

// shade map: 3=outline, 1=light(top), 2=mid(lower)
function buildShade(sp){
  const w=Math.max(...sp.sil.map(r=>r.length));
  const rows=sp.sil.map(r=>r.padEnd(w,' '));
  const h=rows.length;
  const on=(r,c)=> r>=0&&r<h&&c>=0&&c<w && rows[r][c]==='#';
  let top=h,bot=0; for(let r=0;r<h;r++)for(let c=0;c<w;c++) if(on(r,c)){ if(r<top)top=r; if(r>bot)bot=r; }
  const span=Math.max(1,bot-top), map=[];
  for(let r=0;r<h;r++){ const line=[];
    for(let c=0;c<w;c++){
      if(!on(r,c)){ line.push(0); continue; }
      if(!on(r-1,c)||!on(r+1,c)||!on(r,c-1)||!on(r,c+1)){ line.push(3); continue; }
      line.push((r-top)/span<0.42?1:2);
    } map.push(line); }
  sp.shade={map,w,h};
}
for(const k in SPRITES) buildShade(SPRITES[k]);

function drawShaded(key, ox, oy, closed, monoMid){
  const sp=SPRITES[key]; const {map,w,h}=sp.shade;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){ const lv=map[r][c]; if(!lv) continue;
    ctx.fillStyle = monoMid ? STYLE.mid : STYLE.pal[lv]; ctx.fillRect(ox+c,oy+r,1,1); }
  for(const e of (sp.eyes||[])){ const ex=ox+e.x, ey=oy+e.y;
    if(closed){ ctx.fillStyle=STYLE.pal[3]; ctx.fillRect(ex,ey+(e.h>>1),e.w,1); continue; }
    ctx.fillStyle=STYLE.eyeLight; ctx.fillRect(ex,ey,e.w,e.h);
    const pw=Math.max(1,e.w-2), ph=Math.max(1,e.h-2), pxo=e.w>2?1:0, pyo=e.h>2?1:0;
    ctx.fillStyle=STYLE.pupil; ctx.fillRect(ex+pxo,ey+pyo,pw,ph);
  }
  if(sp.mouth && !closed){ ctx.fillStyle=STYLE.pal[3]; ctx.fillRect(ox+sp.mouth.x,oy+sp.mouth.y,sp.mouth.w,sp.mouth.h); }
  return {w,h};
}

function audioUnlock(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function beep(freq,dur,type,vol){ if(muted||!AC) return;
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'square'; o.frequency.value=freq;
  const t=AC.currentTime; g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.08));
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+(dur||0.08)+0.02); }

  if(s.hunger===0)w.push(tr('hungry')); if(s.happy===0)w.push(tr('sad')); if(s.sick)w.push(tr('sick'));
  if(s.poop>0)w.push(tr('messy')); if(wantsSleep())w.push(tr('sleepy'));

  else if(mode==='status'){ cap.innerHTML=tr('<b>SETTINGS</b> — A: change pace · B: language · C: back'); }
  else if(mode==='link'){ cap.innerHTML='<b>'+tr('SUPPORT')+'</b>'+(FEEDBACK_URL?' — '+tr('A: feedback'):'')+(DONATE_URL?' · '+tr('B: donate'):'')+' · '+tr('C: back'); }
  else cap.innerHTML='&nbsp;';
}

/* ============================================================
   SIMULATION
   ============================================================ */
function stepSim(dt){
  if(PAUSED(mode)) return;
  if(!s.alive) return;
  s.ageSec += dt;
  if(s.stage===0){ s.tHatch += dt; if(s.tHatch>=T.hatch) beginHatch(); return; }

  const zf = s.careMode==='zen'?PACE_MULT:1;

  if(s.asleep){ s.tEnergy+=dt;
    while(s.tEnergy>=T.energyGain){ s.tEnergy-=T.energyGain; s.energy=clamp(s.energy+1,0,100); }
    if(s.energy>=96) s.asleep=false; return;
  } else { s.tEnergy+=dt;
    while(s.tEnergy>=T.energyDrain){ s.tEnergy-=T.energyDrain; s.energy=clamp(s.energy-1,0,100); }
    if(!s.lightOn && s.energy<40) s.asleep=true;
  }
  s.tHunger+=dt; while(s.tHunger>=T.hungerInterval*zf){ s.tHunger-=T.hungerInterval*zf; s.hunger=clamp(s.hunger-1,0,4); }
  s.tHappy+=dt;  while(s.tHappy>=T.happyInterval*zf){ s.tHappy-=T.happyInterval*zf; s.happy=clamp(s.happy-1,0,4); }
  s.fullSum+=s.hunger*dt; s.fullN+=dt;

  s.tPoop-=dt; if(s.tPoop<=0){ s.poop=clamp(s.poop+1,0,3); s.tPoop=rand(T.poopInterval*0.7,T.poopInterval*1.4)*zf; }

  const neglected=(s.hunger===0||s.happy===0||s.poop>=2) && s.ageSec>T.sickImmuneUntil;
  if(neglected && !s.sick){ s.tSick+=dt; if(s.tSick>=T.sicknessGrace*zf){ s.sick=true; s.tSick=0; sfx.sick(); } }
  else if(!neglected){ s.tSick=Math.max(0,s.tSick-dt); }

  if(s.sick){ s.tHealth+=dt; while(s.tHealth>=T.healthDrainSick*zf){ s.tHealth-=T.healthDrainSick*zf; s.health=clamp(s.health-1,0,100); } }
  else if(s.hunger>=2 && s.happy>=2 && s.poop===0){ s.tHealth+=dt;
    while(s.tHealth>=T.healthRegen){ s.tHealth-=T.healthRegen; s.health=clamp(s.health+1,0,100); } }
  if(s.health<=0){ if(s.careMode==='zen' || offlineMode){ s.health=6; } else { die(); return; } }  // offline can never kill: no one returns to a dead pet (churn fix)

  s.weight=clamp(s.weight-dt*0.02,10,99);
  strike('Hunger',s.hunger===0,dt); strike('Happy',s.happy===0,dt); strike('Poop',s.poop>=2,dt);
  strike('Sleep',wantsSleep(),dt); strike('Sick',s.sick,dt);

  const th=[0,T.babyToChild,T.childToTeen,T.teenToAdult,T.adultToElder][s.stage];
  if(s.stage<5 && !s.maxed && stageSec()>=th) evolve();
}
function strike(kind,active,dt){ const key='strike'+kind;
  if(active){ s[key]+=dt; if(s[key]>=T.careStrikeAfter){ s.care++; s[key]=-1e9; } } else s[key]=0; }
function beginHatch(){ mode='hatching'; hseq=0; sfx.hatch(); }
function finishHatch(){ s.stage=1; s.stageAt=s.ageSec;
  const bf=pick(BABY_FORMS);
  s.form=bf; s.name=DEX[bf].name;
  s.careAtStage=s.care; s.asleep=false; s.lightOn=true; flash=6;
  mode='naming'; nameIdx=0; s.petName=''; spawnSparkles(W/2,24,10); save();
  if(window.HT1) HT1('hatch/hatched'); }        // ACTIVATION: stuck around ~12s and cracked the egg

// data-driven branching evolution — walks the DEX species graph by care metrics.
// Nodes may have an unconditional default branch (guaranteed evolution) or only
// conditional branches (a "rare" step, e.g. adult→elder, that just doesn't happen
// if you don't qualify — the pet stays put and we flag it maxed so we stop checking).
function evolve(){
  const node = DEX[s.form];
  if(!node || !node.next){ s.maxed = true; return; }
  const c = metrics();
  let to = null, def = null;
  for(const b of node.next){ if(b.when){ if(to===null && b.when(c)) to = b.to; } else def = b.to; }
  if(to===null) to = def;                          // no conditional matched → default (may be null)
  if(to===null || !DEX[to]){ s.maxed = true; return; }   // nothing to become (e.g. adult didn't earn its elder)
  s.stageAt = s.ageSec;
  const nd = DEX[to];
  s.form = to; s.stage = nd.stage; s.name = nd.name;
  s.careAtStage = s.care; s.species = s.form;
  if(window.HT1) HT1('hatch/stage-' + s.stage);   // DEPTH: how far people actually get (2→5)
  if(offlineMode){ save(); return; }              // catch-up silently; reveal shown once at the end
  revealData = { key:s.form, name:s.name };
  mode='reveal'; flash=10; sfx.evolve(); spawnSparkles(W/2,24,12); save();
}
function die(){ s.alive=false; mode='dead'; sfx.die(); save();
  if(window.HT1) HT1('hatch/died'); }             // CHURN: are we losing people by killing their pet?
function setToastless(){ /* reserved */ }

/* ---------- actions (each gives visible feedback; declines with a head-shake) ---------- */
function actFeedMeal(){
  if(s.asleep){ refuse(); return; }
  if(s.hunger>=4){ refuse(); return; }                 // already full — won't force-overeat
  s.hunger=clamp(s.hunger+1,0,4); s.weight=clamp(s.weight+2,10,99); s.tHunger=0;
  setFx('eat',1.2,{food:'meal', onEnd:()=>{ hop=10; spawnHeart(); }}); sfx.eat(); save();
}
function actFeedSnack(){
  if(s.asleep){ refuse(); return; }
  s.happy=clamp(s.happy+1,0,4); s.weight=clamp(s.weight+3,10,99); s.overfeed+=1;   // snacks drive the chonky path
  setFx('eat',1.1,{food:'snack', onEnd:()=>{ hop=10; spawnHeart(); }}); sfx.eat(); save();
}
function actClean(){
  if(s.poop<=0){ refuse(); return; }
  s.poop=0; s.health=clamp(s.health+3,0,100); setFx('clean',1.0,{}); sfx.clean(); save();
}
function actLight(){
  s.lightOn=!s.lightOn;
  if(!s.lightOn){ if(s.energy<45) s.asleep=true; }
  else { if(s.asleep && s.energy<80) s.care++; s.asleep=false; }
  setFx('light',0.8,{on:s.lightOn}); sfx.back(); save();
}
function actMedicine(){
  if(!s.sick){ refuse(); return; }
  s.sick=false; s.health=clamp(s.health+12,0,100); s.tSick=0;
  setFx('med',1.2,{onEnd:()=>{ hop=8; spawnHeart(); spawnSparkles(W/2,26,6); }}); sfx.happy(); save();
}
function actTrainPraise(){
  if(s.asleep){ refuse(); return; }
  if(s.energy<12){ refuse(); return; }                 // too tired to train
  s.discipline=clamp(s.discipline+9,0,100); s.training++; s.happy=clamp(s.happy+1,0,4);
  s.energy=clamp(s.energy-3,0,100); setFx('train',1.0,{onEnd:()=>{ hop=12; }}); sfx.happy(); save();
}

/* ---------- mini-games: a selector + guess / memory / timing ---------- */
let gsel=0;
const GAMES=[{id:'guess',name:'GUESS'},{id:'memory',name:'COPY ME'},{id:'timing',name:'TIMING'}];
const ARRL=["  #"," ##","###"," ##","  #"], ARRR=["#  ","## ","###","## ","#  "];
function openPlay(){ if(s.asleep||s.energy<10){ refuse(); return; } mode='playmenu'; gsel=0; }
function startGame(type){
  if(type==='guess'){ game={type:'guess',round:1,wins:0,phase:'guess',dir:0,reveal:0}; nextGuess(); }
  else if(type==='memory'){ game={type:'memory',round:1,wins:0,len:2}; startMemRound(); }
  else if(type==='timing'){ game={type:'timing',round:1,wins:0,pos:4,dir:1,phase:'move',speed:1.0}; }
  mode='play';
}
function finishGame(){ const w=game?game.wins:0; const gt=game?game.type:'guess';
  s.happy=clamp(s.happy+(w>=2?1:0)+(w>=3?1:0),0,4); s.energy=clamp(s.energy-6,0,100);
  const per={guess:10,memory:20,timing:15}[gt]||10;
  if(!s.hi) s.hi={guess:0,memory:0,timing:0}; if(typeof s.points!=='number') s.points=0;
  s.points+=w*per; const best=w>(s.hi[gt]||0); if(best) s.hi[gt]=w;   // high score = best streak (uncapped)
  if(w>=2){ hop=14; sfx.happy(); }
  showToast(w>0 ? (tr(best?'NEW BEST':'SCORE')+' '+w) : tr('SCORE')+' 0');
  game=null; mode='roam'; save();
}
/* guess */
function nextGuess(){ game.phase='guess'; game.dir=Math.random()<0.5?-1:1; game.reveal=0; }
function guess(dir){ if(!game||game.type!=='guess'||game.phase!=='guess') return;
  game.phase='reveal'; game.reveal=22; const correct=(dir===game.dir); if(correct) game.wins++; beep(correct?880:220,0.12);
  setTimeout(()=>{ if(!game) return; if(correct){ game.round++; nextGuess(); } else finishGame(); }, 520);   // endless until a wrong guess
}
/* memory (Simon-style): pet flashes a growing L/R sequence, you repeat it */
function startMemRound(){ game.seq=[]; for(let i=0;i<game.len;i++) game.seq.push(Math.random()<0.5?-1:1);
  game.phase='show'; game.showT=0; game.curShow=0; game.idx=0; }
function memInput(dir){ if(!game||game.type!=='memory'||game.phase!=='input') return;
  if(dir===game.seq[game.idx]){ beep(880,0.05); game.idx++;
    if(game.idx>=game.seq.length){ game.wins++; game.phase='result'; game.resT=0.8; game.lastWin=true; beep(988,0.12); } }
  else { game.phase='result'; game.resT=0.9; game.lastWin=false; beep(200,0.16); }
}
/* timing: stop the sliding marker in the target zone */
function timingLock(){ if(!game||game.type!=='timing'||game.phase!=='move') return;
  const win=game.pos>=W/2-7 && game.pos<=W/2+7; if(win) game.wins++;
  beep(win?880:220,0.12); game.phase='result'; game.resT=0.7; game.lastWin=win;
}
function updateGame(dt){ if(!game) return;
  if(game.type==='memory'){
    if(game.phase==='show'){ game.showT+=dt; const step=0.62, i=Math.floor(game.showT/step);
      if(i>=game.seq.length){ game.phase='input'; game.idx=0; game.curShow=0; }
      else game.curShow=(game.showT-i*step<0.38)?game.seq[i]:0;
    } else if(game.phase==='result'){ game.resT-=dt; if(game.resT<=0){
      if(!game.lastWin) finishGame(); else { game.round++; game.len++; startMemRound(); } } }   // endless until a miss
  } else if(game.type==='timing'){
    if(game.phase==='move'){ game.pos+=game.dir*game.speed*dt*60;
      if(game.pos>W-5){ game.pos=W-5; game.dir=-1; } if(game.pos<4){ game.pos=4; game.dir=1; } }
    else if(game.phase==='result'){ game.resT-=dt; if(game.resT<=0){
      if(!game.lastWin) finishGame(); else { game.round++; game.phase='move'; game.speed+=0.4; } } }   // endless until a miss
  }
}

function petKey(){ return s.stage===0 ? 'egg' : (s.form||'momo'); }

function render(){

  if(STYLE.grid){ ctx.fillStyle='rgba(15,35,10,0.05)'; for(let x=1;x<W;x+=2) ctx.fillRect(x,0,1,H); }
  if(flash>0){ ctx.fillStyle=(flash%2?LCD.ink:LCD.bg); ctx.fillRect(0,0,W,H); flash--; if(flash>0){ caption(); return; } }

  if(mode==='splash'){ renderSplash(); caption(); return; }
  if(mode==='setup'){ renderSetup(); caption(); return; }
  if(mode==='hatching'){ renderHatching(); caption(); return; }
  if(mode==='naming'){ renderNaming(); caption(); return; }
  if(mode==='reveal'){ renderReveal(); caption(); return; }
  if(mode==='dead'){ renderDead(); caption(); return; }

  if(s.stage>0 && mode==='roam'){
    for(let i=0;i<8;i++) blit(ICONS[MENU[i].id], i*8+1, 1, LCD.mid);

  if(mode==='status') renderStatus();

  else if(mode==='playmenu') renderPlayMenu();
  else if(mode==='play') renderPlay();
  else { renderPet(22); renderStatBars(); }

  // lights-off = night: dim the whole panel + show a moon (clear feedback that LIGHT did something)
  const gameplay = (mode==='roam'||mode==='feed'||mode==='play'||mode==='train');
  if(s.stage>0 && !s.lightOn && gameplay){
    ctx.fillStyle=STYLE.night; ctx.fillRect(0,0,W,H);
    blit(MOON, W-6, 2, LCD.mid);
  }
  // brief sun/moon burst when toggling the light
  if(fx && fx.kind==='light'){ const g=fx.on?SUN:MOON; blit(g, Math.round(W/2)-3, 27, fx.on?LCD.ink:LCD.mid); }
  if(fastMode && mode==='roam' && s.stage>0) drawText('>>',27,58,LCD.mid);
  if(toastT>0){ const tw=textWidth(toast); ctx.fillStyle=LCD.bg; ctx.fillRect((W-tw)/2-2,56,tw+4,7); drawTextCenter(toast,57,LCD.ink); }
  caption();
}

function renderPet(cy){
  const key=petKey(), sp=SPRITES[key], w=sp.shade.w, cx=w>>1;
  const bob=Math.round(Math.sin(tick/22)*1.2)+(s.asleep?1:0);
  let px=Math.round((W-w)/2)+Math.round(wanderX);
  let py=cy+bob-Math.round(hop);
  if(s.stage===0){ px=Math.round((W-w)/2)+Math.round(Math.sin(tick/9)*2); py=cy; }
  // head-shake while declining
  if(fx && fx.kind==='refuse') px += (Math.floor(tick/2)%2 ? 2 : -2);
  if(fx && fx.kind==='train') py -= (Math.floor(tick/3)%2 ? 2 : 0);   // doing reps
  if(fx && fx.kind==='eat')   py += (Math.floor(tick/4)%2 ? 1 : 0);   // chewing
  if(fx && fx.kind==='med')   py += (Math.floor(tick/5)%2 ? 1 : 0);   // taking medicine
  const closed = s.asleep || (blink>34 && blink<38);
  drawShaded(key, px, py, closed, false);

  // status marks
  if(s.sick && !(fx&&fx.kind==='med')){ blit(["# #"," # ","# #"], px+cx-1, py-6, LCD.ink); }
  if(s.asleep){ drawText('Z', px+w-2, py-2, LCD.mid); drawText('Z', px+w, py-6, LCD.mid); }
  if(needsAttention() && !s.asleep && !fx && blink<26){ blit(["1","1","1","0","1"], px-4, py+2, LCD.ink); blit(["1","1","1","0","1"], px+w+2, py+2, LCD.ink); }
  for(let i=0;i<s.poop;i++) blit(["  ## "," ####","#####"], 2+i*8, 54, LCD.mid);

  // action animations
  if(fx){
    if(fx.kind==='eat' && fx.t>fx.dur*0.12){
      const full=fx.t>fx.dur*0.5;
      const bm = fx.food==='snack' ? (full?FOOD.snack:FOOD.snackHalf) : (full?FOOD.meal:FOOD.mealHalf);
      blit(bm, px-6, py+7, LCD.ink);
    } else if(fx.kind==='clean'){
      const sweep=Math.round((1-fx.t/fx.dur)*(W-8));
      blit(["  #"," ##","###"], sweep, 50, LCD.ink);
      if(fx.t>fx.dur*0.5) blit(["#"], sweep+4, 47, LCD.mid);
    } else if(fx.kind==='med'){
      if(fx.t>fx.dur*0.55){ blit([" ## "," ## "], px+cx-1, py-8, LCD.ink); }                       // capsule going in
      else if(Math.floor(tick/4)%2){ blit(["00#00","00#00","#####","00#00","00#00"], px+cx-2, py-9, LCD.ink); }  // pulsing +
      else { blit(["0#0","###","0#0"], px+cx-1, py-8, LCD.ink); }
    } else if(fx.kind==='train'){
      blit(["##   ##","#######","##   ##"], px+cx-3, py-9, LCD.ink);   // barbell overhead
      if(Math.floor(tick/6)%2) blit(SWEAT, px+w+1, py+1, LCD.mid);
    } else if(fx.kind==='refuse'){
      blit(SWEAT, px+w+1, py+1, LCD.ink);
    }
  }
  drawParts();
}

  drawShaded(petKey(), Math.round((W-SPRITES[petKey()].shade.w)/2), 15, false, false);

  else drawTextCenter(game.lastWin?tr('HIT!'):tr('MISS'),58,LCD.ink);

function customNamePrompt(){ let n=''; try{ n=window.prompt('Name your pet (up to 8 characters):',''); }catch(e){}
  if(!n) return ''; return n.toUpperCase().replace(/[^A-Z0-9 !.\-]/g,'').trim().slice(0,8); }
function pressA(){ audioUnlock();
  if(mode==='splash'){ mode=bootMode; render(); return; }
  if(mode==='setup'){ sub=sub?0:1; sfx.move(); render(); return; }
  if(mode==='naming'){ nameIdx=(nameIdx+1)%NAME_POOL.length; sfx.move(); render(); return; }
  if(PAUSED(mode)) return;
  if(!s.alive || s.stage===0) return;
  if(mode==='roam'){ cursor=(cursor+1)%8; sfx.move(); }
  else if(mode==='feed'){ sub=sub?0:1; sfx.move(); }
  else if(mode==='playmenu'){ gsel=(gsel+1)%GAMES.length; sfx.move(); }
  else if(mode==='play'){ if(game&&game.type==='guess') guess(-1); else if(game&&game.type==='memory') memInput(-1); }
  else if(mode==='status'){ s.careMode = s.careMode==='zen'?'classic':'zen'; save();
    showToast(tr(s.careMode==='zen'?'PACE: GENTLE':'PACE: AUTHENTIC')); sfx.move(); }
  else if(mode==='link'){ if(FEEDBACK_URL){ if(window.HT) HT('hatch/feedback-click'); try{ window.open(FEEDBACK_URL,'_blank'); }catch(e){} } }
  render();
}
function pressB(){ audioUnlock();
  if(mode==='splash'){ mode=bootMode; render(); return; }
  if(mode==='link'){ if(DONATE_URL){ if(window.HT) HT('hatch/donate-click'); try{ window.open(DONATE_URL,'_blank'); }catch(e){} } render(); return; }
  if(mode==='setup'){ s.careMode=sub?'zen':'classic'; s.chosen=true; mode='roam'; sfx.enter(); save(); render(); return; }
  if(mode==='naming'){ s.petName=NAME_POOL[nameIdx]; mode='roam'; sfx.happy(); spawnHeart(); save();
    if(window.HT1) HT1('hatch/named');            // ONBOARDED: named the pet, now actually playing
    render(); return; }
  if(mode==='reveal'){ mode='roam'; revealData=null; sfx.enter(); render(); return; }
  if(mode==='hatching') return;
  if(!s.alive){ const cm=s.careMode; s=freshEgg(); s.careMode=cm; s.chosen=true; mode='roam'; cursor=0; save(); render(); return; }
  if(s.stage===0){ s.tHatch=Math.max(s.tHatch,T.hatch-0.5); render(); return; }
  if(mode==='roam'){ const id=MENU[cursor].id; sfx.enter();
    if(id==='feed'){ if(s.asleep){ refuse(); } else { mode='feed'; sub=0; } }
    else if(id==='light') actLight();
    else if(id==='play') openPlay();
    else if(id==='med') actMedicine();
    else if(id==='clean') actClean();
    else if(id==='train') actTrainPraise();
    else if(id==='status'){ mode='status'; statusScroll=0; }
    else if(id==='link'){ mode='link'; if(window.HT) HT('hatch/support-open'); }
  }
  else if(mode==='feed'){ if(sub===0) actFeedMeal(); else actFeedSnack(); mode='roam'; }
  else if(mode==='playmenu'){ startGame(GAMES[gsel].id); sfx.enter(); }
  else if(mode==='play'){ if(game&&game.type==='guess') guess(1); else if(game&&game.type==='memory') memInput(1); else if(game&&game.type==='timing') timingLock(); }
  else if(mode==='status'){ setLang(lang==='id'?'en':'id'); showToast(tr(lang==='id'?'LANG: ID':'LANG: EN')); sfx.move(); }
  render();
}
function pressC(){ audioUnlock();
  if(mode==='splash'){ mode=bootMode; render(); return; }
  if(mode==='naming'){ const nm=customNamePrompt(); if(nm){ s.petName=nm; mode='roam'; sfx.happy(); spawnHeart(); save(); } render(); return; }
  if(!PAUSED(mode) && mode!=='roam' && mode!=='dead'){ mode='roam'; game=null; sfx.back(); }
  else if(mode==='roam' && cursor!==0){ sfx.back(); }   // C also snaps the menu selector back to the first slot
  cursor=0;
  render();
}
window.addEventListener('keydown', e=>{ const k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft'){ e.preventDefault(); flashBtn('bA'); pressA(); }
  else if(k==='b'||k==='enter'||k===' '||k==='arrowright'){ e.preventDefault(); flashBtn('bB'); pressB(); }
  else if(k==='c'||k==='escape'){ e.preventDefault(); flashBtn('bC'); pressC(); }

});

/* ============================================================
   PERSISTENCE
   ============================================================ */
function save(){ try{ s.last=Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
function load(){ let d=null; try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  if(!d || d.v!==6){ s=freshEgg(); mode='setup'; return; }
  s=d; if(typeof s.stageAt!=='number') s.stageAt=0;
  if(!s.hi) s.hi={guess:0,memory:0,timing:0}; else { for(var hk in s.hi){ if(s.hi[hk]>20) s.hi[hk]=0; } }   // backfill; migrate old point-based highs to streak
  if(typeof s.points!=='number') s.points=0;
  if(!s.chosen){ mode='setup'; return; }
  const wasAlive=s.alive; let dt=clamp((Date.now()-(s.last||Date.now()))/1000,0,T.offlineCap);
  if(dt>2) advanceOffline(dt,wasAlive);
}
function advanceOffline(dt,wasAlive){ offlineMode=true; const startStage=s.stage; let left=dt;
  while(left>0 && s.alive){ const d=Math.min(60,left); stepSim(d); left-=d; }
  offlineMode=false;
  if(wasAlive && !s.alive){ s.alive=true; s.health=30; s.sick=false; s.hunger=1; s.happy=1; s.poop=Math.min(s.poop,1); mode='roam'; }
  else if(wasAlive && s.stage>startStage && s.stage>=1){ revealData={key:s.form,name:s.name}; mode='reveal'; }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastTs=performance.now(), saveAcc=0;
function loop(now){ const dt=Math.min(0.25,(now-lastTs)/1000); lastTs=now;
  tick++; blink=(blink+1)%48; if(hop>0) hop=Math.max(0,hop-1);
  if(mode==='splash'){ splashT+=dt; if(splashT>=1.8) mode=bootMode; }
  if(mode==='status') statusScroll+=dt*9; else statusScroll=0;
  if(fx){ fx.t-=dt; if(fx.t<=0){ const cb=fx.onEnd; fx=null; if(cb) cb(); } }
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t-=dt; p.y-=dt*11; if(p.t<=0) parts.splice(i,1); }
  if(mode==='hatching'){ hseq+=dt; if(hseq>=HATCH_ANIM) finishHatch(); }
  if(toastT>0) toastT-=dt;
  if(s.alive && s.stage>0 && !s.asleep && mode==='roam'){
    wanderX+=wanderDir*0.15; if(wanderX>9)wanderDir=-1; if(wanderX<-9)wanderDir=1; if(Math.random()<0.01) wanderDir*=-1;
    idleT+=dt; if(idleT>9 && !fx && hop===0){ idleT=0; const r=Math.random();      // occasional idle flourish
      if(r<0.45) hop=10; else if(r<0.75){ wanderDir*=-1; hop=6; } else spawnHeart(); }
  } else { wanderX*=0.9; idleT=0; }
  stepSim(dt * (fastMode?60:1));
  if(mode==='play') updateGame(dt);
  if(needsAttention() && !s.asleep && tick%1000===0) sfx.call();
  saveAcc+=dt; if(saveAcc>4){ saveAcc=0; save(); }
  render(); requestAnimationFrame(loop);
}

<script>
/* Register the service worker so HATCH installs to the home screen and works
   offline. Harmlessly no-ops on hosts that don't serve /sw.js (e.g. the artifact). */
if ('serviceWorker' in navigator) {
  addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
}
</script>
<script>
/* Privacy-friendly, cookieless analytics (GoatCounter — free, GDPR-safe, no consent banner).
   Exposes two helpers the game calls to report the funnel:
     HT(name)  — count every time it happens (clicks)
     HT1(name) — count only the FIRST time this browser ever does it. Funnel steps MUST be
                 once-per-visitor or the ratios are meaningless (a replayer would count twice).
   All event names are namespaced `hatch/…` so other apps on this GoatCounter site can't collide.
   Nothing is sent from localhost/file:// or from a browser that ever loaded ?notrack=1 — that
   keeps Sam's own dev + testing loads out of the real numbers. */
(function () {
  var GC = 'https://samfirn.goatcounter.com/count';   // Kupo's GoatCounter endpoint
  var h = location.hostname;
  var off = !GC || location.protocol === 'file:' || h === 'localhost' || h === '127.0.0.1' || h === '' || /^(192\.168|10)\./.test(h);
  try {
    if (/[?&]notrack=1/.test(location.search)) localStorage.setItem('hatch_notrack', '1');
    if (localStorage.getItem('hatch_notrack') === '1') off = true;
  } catch (e) {}

  var q = [];                                  // events fired before count.js finished loading
  window.HT = function (name) {
    if (off) return;
    if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: 'hatch', event: true });
    else if (q.length < 40) q.push(name);
  };
  window.HT1 = function (name) {
    if (off) return;
    try {
      var seen = JSON.parse(localStorage.getItem('hatch_ev') || '[]');
      if (seen.indexOf(name) >= 0) return;
      seen.push(name); localStorage.setItem('hatch_ev', JSON.stringify(seen));
    } catch (e) {}
    window.HT(name);
  };
  if (off) return;

  var s = document.createElement('script');
  s.async = true; s.src = '//gc.zgo.at/count.js'; s.setAttribute('data-goatcounter', GC);
  document.head.appendChild(s);

  var tries = 0;
  (function ready() {
    if (!(window.goatcounter && window.goatcounter.count)) { if (tries++ < 40) setTimeout(ready, 500); return; }
    while (q.length) window.HT(q.shift());
    // --- retention: count DISTINCT days this browser has opened Hatch and report the cohort.
    //     Fires ONLY on a day we haven't seen before, so reloads don't inflate "returning". ---
    try {
      var days = JSON.parse(localStorage.getItem('hatch_days') || '[]');
      var today = new Date().toISOString().slice(0, 10);
      if (days.indexOf(today) >= 0) return;                       // already counted today
      days.push(today); localStorage.setItem('hatch_days', JSON.stringify(days.slice(-90)));
      var n = days.length;
      window.HT('hatch/' + (n === 1 ? 'new-visitor' : 'returning-visitor'));
      window.HT('hatch/' + (n === 1 ? 'day-1' : n === 2 ? 'day-2' : 'day-3plus'));
    } catch (e) {}
  })();
})();
</script>

<div id="a2hsBar">
  <div class="ic">🥚</div>
  <div class="txt"><b id="a2hsTitle">Add Hatch to your phone</b><span id="a2hsMsg">One-tap, full-screen, plays offline.</span></div>
  <button class="act" id="a2hsInstall">Install</button>
  <button class="x" id="a2hsClose" aria-label="Dismiss">×</button>
</div>
<script>
/* Add-to-Home-Screen prompt: Android native install / iOS Safari Share hint. SW already registered above.
   Self-contained language pick (mirrors the game's detect: saved pref, else id/in/ms locale → Bahasa) —
   the game's tr() lives in another scope, so this script localizes on its own. */
(function(){
  var bar=document.getElementById('a2hsBar'),btn=document.getElementById('a2hsInstall'),
      x=document.getElementById('a2hsClose'),msg=document.getElementById('a2hsMsg'),
      title=document.getElementById('a2hsTitle');
  if(!bar)return;
  var L='en';
  try{ var sv=localStorage.getItem('hatch_lang');
    if(sv==='id'||sv==='en'){ L=sv; }
    else { var nl=((navigator.language||navigator.userLanguage||'')+'').toLowerCase();
      if(nl.startsWith('id')||nl.startsWith('in')||nl.startsWith('ms')) L='id'; } }catch(e){}
  var STR = L==='id' ? {
    title:'Tambahkan Hatch ke ponselmu', msg:'Sekali ketuk, layar penuh, bisa main offline.', install:'Pasang',
    ios:'Ketuk <span class="a2hs-share">⎋ Bagikan</span>, lalu <b style="display:inline">Tambah ke Layar Utama</b>.'
  } : {
    title:'Add Hatch to your phone', msg:'One-tap, full-screen, plays offline.', install:'Install',
    ios:'Tap <span class="a2hs-share">⎋ Share</span>, then <b style="display:inline">Add to Home Screen</b>.'
  };
  if(title) title.textContent=STR.title; msg.textContent=STR.msg; btn.textContent=STR.install;
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  var ua=navigator.userAgent;
  var isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var iosCanA2HS=isIOS&&!/crios|fxios|edgios/i.test(ua);
  var dismissed=localStorage.getItem('hatch_a2hs')==='1';
  var deferred=null;
  function show(){ if(!dismissed&&!standalone) bar.classList.add('show'); }
  function hide(){ bar.classList.remove('show'); }
  function remember(){ localStorage.setItem('hatch_a2hs','1'); }
  x.onclick=function(){ hide(); remember(); };
  addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; btn.style.display=''; msg.textContent=STR.msg; show(); });
  btn.onclick=function(){ if(!deferred)return; if(window.HT)HT('hatch/install-prompt'); deferred.prompt(); deferred.userChoice.then(function(r){ deferred=null; hide(); if(r&&r.outcome==='accepted'){ remember(); if(window.HT1)HT1('hatch/installed'); } }).catch(function(){ deferred=null; hide(); }); };
  addEventListener('appinstalled',function(){ hide(); remember(); if(window.HT1)HT1('hatch/installed'); });
  if(iosCanA2HS&&!standalone&&!dismissed){
    btn.style.display='none';
    msg.innerHTML=STR.ios;
    setTimeout(show,1600);
  }
})();
</script>
